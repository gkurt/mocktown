name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun i
      - run: bun check
      - run: bun run test
      - run: bun typecheck
      # Builds the tarball the way a release would, without publishing: `prepack` builds
      # the shell, copies it in and regenerates the skill pack, then asserts each part
      # landed. Covers the old `gui:build` step — a shell that does not build fails here —
      # and catches the packaging failures that are otherwise invisible until a consumer
      # installs: a file the `files` allowlist forgot, or a broken prepack.
      - run: bun pm pack --dry-run
        working-directory: packages/mocktown
